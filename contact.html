<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Starter Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head><body>
<div id="site-header"></div>
<section class="page-head"><div class="wrap"><div class="eyebrow">Contact</div><h1>We'd love to hear from you.</h1><p class="lead">Questions, feedback, or a custom order? Send us a message.</p></div></section>
<section style="padding-top:0"><div class="wrap grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:start">
  <div class="card reveal">
    <h3>Send a message</h3>
    <div style="margin-top:14px">
      <form class="stack" data-demo="Thanks! We'll reply within 24 hours.">
        <input placeholder="Your name" required>
        <input type="email" placeholder="Email address" required>
        <select required><option value="">Topic</option><option>Order help</option><option>Returns</option><option>Business orders</option><option>Other</option></select>
        <textarea placeholder="How can we help?" required></textarea>
        <button class="btn" type="submit">Send message</button>
      </form>
      <div class="notice"></div>
    </div>
  </div>
  <div class="reveal" style="padding-top:8px">
    <div class="card" style="margin-bottom:16px"><h3>Email</h3><p class="muted">hello@starterstore.example</p></div>
    <div class="card" style="margin-bottom:16px"><h3>Phone</h3><p class="muted">+1 (555) 010-2030, Mon to Fri, 9am to 5pm</p></div>
    <div class="card"><h3>Studio</h3><p class="muted">12 Market Lane, Suite 4<br>Your City</p></div>
  </div>
</div></section>
<div id="site-footer"></div>
<script src="script.js"></script>
</body></html>
